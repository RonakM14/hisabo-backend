spring.application.name=hisabo-backend
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
ledger.data-dir=${LEDGER_DATA_DIR:./data}
ledger.seed-demo=${LEDGER_SEED_DEMO:true}
ledger.allowed-origins=${LEDGER_ALLOWED_ORIGINS:http://hisabo.localhost:5173,http://hisabo.localhost:4173,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
spring.jackson.deserialization.fail-on-unknown-properties=true
